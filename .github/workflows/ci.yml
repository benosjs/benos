name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:engines
      - run: pnpm build
      - run: pnpm registry:check
      - run: pnpm gallery:build
      - run: pnpm exec tsc -p examples/ui-gallery/tsconfig.json --noEmit
      - run: pnpm exec tsc -p examples/dashboard/tsconfig.json --noEmit
      - run: pnpm --filter @benosjs/dashboard build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
      - run: pnpm typecheck:types
      - run: pnpm check:jsx-types
      - run: pnpm check:doc-examples
      - run: pnpm check:flagship
      - run: pnpm check:public-imports
      - run: pnpm check:packed
      - run: pnpm audit:template
      - run: pnpm lint
      - run: pnpm size
      - run: pnpm bench:guard
      - run: pnpm test:browser
      - run: pnpm test:server-runtime

  server-bun:
    name: Server on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun --version
      - run: bun scripts/test-server-runtime.mjs

  create-benos:
    name: create-benos npm ${{ matrix.npm_major }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        npm_major: [10, 11]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: npm install --global npm@${{ matrix.npm_major }}
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:engines
      - run: pnpm exec vitest run tests/create-benos.test.ts
      - name: Install and verify a fresh starter with npm ${{ matrix.npm_major }}
        env:
          BENOS_EXPECT_NPM_MAJOR: ${{ matrix.npm_major }}
        run: node scripts/test-create-benos-npm-install.mjs

  ui-cli-consumer:
    name: UI CLI (${{ matrix.os }}, ${{ matrix.package_manager }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package_manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.package_manager == 'bun'
        with:
          bun-version: 1.2.0
      - name: Enable Yarn 4
        if: matrix.package_manager == 'yarn'
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm registry:check
      - name: Require npm 10 for npm consumer tests
        if: matrix.package_manager == 'npm'
        run: node -e "const v=require('node:child_process').execSync('npm --version',{encoding:'utf8'}).trim();if(v.split('.')[0]!=='10')throw Error('Expected npm 10, got '+v);console.log('npm '+v)"
      - name: Test packed benos CLI bin shims
        env:
          BENOS_PACKAGE_MANAGER: ${{ matrix.package_manager }}
        run: node scripts/test-packed-benos-cli.mjs
      - name: Test a fresh create-benos consumer
        env:
          BENOS_PACKAGE_MANAGER: ${{ matrix.package_manager }}
        run: node scripts/test-ui-cli-project.mjs
